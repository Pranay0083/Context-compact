[project]
name = "context-compact"
version = "0.1.0"
description = "Model-driven, recoverable context compaction middleware for LangChain agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain>=1.2",
  "langchain-core>=1.2",
  "langchain-groq>=1.0",
  "tiktoken>=0.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
xai = ["langchain-xai>=1.0"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_compact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
